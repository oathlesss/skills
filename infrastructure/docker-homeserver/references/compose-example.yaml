# Tailscale service for docker-compose.yml
# Requires: mkdir -p ./tailscale/state
# Requires: TAILSCALE_AUTHKEY in .env (remove after first run)

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_HOSTNAME=homelab
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTHKEY=***      - TS_EXTRA_ARGS=--accept-routes
